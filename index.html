// ═══════════════════════════════════════════════

const patterns = [
  { name: "Factory Method", category: "Creational", complexity: 1, problem: "You need to create objects but don't know the exact type until runtime", when: "Multiple implementations of an interface, type depends on config/input", avoid: "Only one implementation exists — just use new directly", example: "StorageClientFactory → S3Client or AzureBlobClient based on env config", howItWorks: "Define an interface for creating objects. Subclasses or config decide which concrete class to instantiate. Caller works with the interface, never the concrete type.", pairs: ["Strategy", "Abstract Factory", "Template Method"], tags: ["creation", "polymorphism", "loose coupling", "runtime decision"] , python: "class NotifierFactory:\n    @staticmethod\n    def create(type_str):\n        if type_str == 'email':\n            return EmailNotifier()\n        elif type_str == 'sms':\n            return SMSNotifier()\nnotifier = NotifierFactory.create('email')", realWorld: "A vending machine button that produces different items (soda, snacks) based on which button you press, without showing you the internal mechanism" },
  { name: "Abstract Factory", category: "Creational", complexity: 2, problem: "You need families of related objects that must be used together consistently", when: "Cross-platform UI toolkits, themed component systems, multi-cloud SDKs", avoid: "You only have one product family — use simple Factory", example: "CloudProviderFactory → creates matching Compute + Storage + Queue for AWS or Azure", howItWorks: "A factory interface declares creation methods for each product type. Concrete factories produce matching product families.", pairs: ["Factory Method", "Builder", "Singleton"], tags: ["families", "consistency", "platform"] , python: "class UIFactory:\n    def create_button(self): pass\n    def create_input(self): pass\nclass WindowsFactory(UIFactory):\n    def create_button(self): return WindowsButton()\nclass MacFactory(UIFactory):\n    def create_button(self): return MacButton()", realWorld: "An appliance manufacturer with separate production lines for different countries—each line produces a complete set of compatible appliances" },
  { name: "Builder", category: "Creational", complexity: 1, problem: "Complex object construction with many optional parameters or steps", when: "Constructors with 5+ params, fluent APIs, query builders, config objects", avoid: "Object is simple with few fields — constructor is fine", example: "ForecastConfigBuilder.model('ets').horizon(30).frequency('daily').seasonality(true).build()", howItWorks: "Separate construction from representation. A builder accumulates parameters through chained calls, then produces the final object in build().", pairs: ["Factory Method", "Prototype", "Composite"], tags: ["fluent", "construction", "configuration"] , python: "query = QueryBuilder().select('name', 'age').from_table('users').where('age > 18').build()\nconfig = Config().api_key('xxx').timeout(30).retries(3).build()", realWorld: "Building a custom pizza—you choose the crust, toppings, cheese separately, and at the end the pizzaiolo assembles it all" },
  { name: "Singleton", category: "Creational", complexity: 1, problem: "Need exactly one instance shared globally across the application", when: "Connection pools, loggers, config managers, hardware interfaces", avoid: "Almost always — prefer dependency injection. Singletons are global state in disguise", example: "DatabasePool.getInstance() — but a DI container managing lifecycle is usually better", howItWorks: "Class controls its own instantiation with a private constructor and a static method returning the same instance.", pairs: ["Factory Method", "Abstract Factory"], tags: ["global", "shared state", "anti-pattern risk"] , python: "class Config:\n    _instance = None\n    def __new__(cls):\n        if cls._instance is None:\n            cls._instance = super().__new__(cls)\n        return cls._instance\nconfig1 = Config()\nconfig2 = Config()  # Same instance", realWorld: "The President of a country—there's only one at any given time, and everyone communicates through that single office" },
  { name: "Prototype", category: "Creational", complexity: 1, problem: "Creating objects is expensive, but cloning an existing one is cheap", when: "Deep-copying config templates, document templates, game entities", avoid: "Objects are cheap to create or rarely need duplication", example: "Clone a base forecast config template and tweak parameters per account", howItWorks: "Objects implement clone() that creates a deep copy. New instances by copying a prototype rather than constructors.", pairs: ["Builder", "Factory Method", "Memento"], tags: ["clone", "copy", "template", "expensive creation"] , python: "import copy\noriginal = ForecastConfig(model='ets', horizon=30)\nclone = copy.deepcopy(original)\nclone.horizon = 90  # Modify without affecting original", realWorld: "Photocopying a document—the copy is independent but created from an existing template without rebuilding from scratch" },
  { name: "Object Pool", category: "Creational", complexity: 2, problem: "Creating and destroying objects is expensive and happens frequently", when: "Database connections, thread pools, network sockets, game objects", avoid: "Object creation is cheap, or pool management overhead isn't justified", example: "ConnectionPool pre-creates 20 DB connections, hands them out on request, reclaims on release", howItWorks: "Maintain a pool of initialized objects. Clients check out and return. Pool manages lifecycle, limits, and health.", pairs: ["Singleton", "Flyweight", "Factory Method"], tags: ["reuse", "performance", "connection pool"] , python: "class ConnectionPool:\n    def __init__(self, size=10):\n        self.available = [Connection() for _ in range(size)]\n    def acquire(self):\n        return self.available.pop()\n    def release(self, conn):\n        self.available.append(conn)", realWorld: "A library that lends books—instead of printing a new book for each reader, they temporarily borrow from a limited collection" },
  { name: "Lazy Initialization", category: "Creational", complexity: 1, problem: "Expensive resources are created upfront but may never be used", when: "Heavy objects not always needed, conditional feature loading", avoid: "Object is always needed, or creation is cheap", example: "ML model loaded into memory only when first forecast request arrives, not at startup", howItWorks: "Defer creation until first access. Null check — if null, create; otherwise return existing.", pairs: ["Proxy", "Singleton", "Factory Method"], tags: ["deferred", "performance", "startup time"] , python: "class ExpensiveResource:\n    def __init__(self):\n        self._data = None\n    def get_data(self):\n        if self._data is None:\n            self._data = self._load_expensive_data()\n        return self._data", realWorld: "An on-demand video service—you don't download all shows at once, but only stream what you watch" },
  { name: "Adapter", category: "Structural", complexity: 1, problem: "Incompatible interfaces need to work together", when: "Integrating legacy APIs, third-party libs, format translation, API versioning", avoid: "You control both interfaces — just refactor directly", example: "Wrap Azure Doc Intelligence XML response into your standard JSON schema", howItWorks: "Wrapper class translates the interface of an existing class into what the client expects.", pairs: ["Facade", "Bridge", "Decorator"], tags: ["integration", "legacy", "wrapper", "translation"] , python: "class LegacyAPI:\n    def get_data_xml(self): return '<data>test</data>'\nclass Adapter:\n    def __init__(self, legacy):\n        self.legacy = legacy\n    def get_json(self):\n        return {'data': 'test'}  # Converts XML to JSON", realWorld: "An electrical outlet adapter that lets your US plug work in a European socket—translating between two incompatible interfaces" },
  { name: "Facade", category: "Structural", complexity: 1, problem: "Subsystem is complex, callers need a simple unified entry point", when: "Library wrappers, API simplification, hiding internal complexity", avoid: "Subsystem is already simple, or callers need fine-grained control", example: "ForecastService.predict(accountId) hides model selection, preprocessing, validation", howItWorks: "Single simplified class delegates to appropriate subsystem components.", pairs: ["Adapter", "Mediator", "Singleton"], tags: ["simplification", "API", "entry point"] , python: "class MovieFacade:\n    def __init__(self):\n        self.projector = Projector()\n        self.sound_system = SoundSystem()\n    def watch_movie(self, film):\n        self.projector.turn_on()\n        self.sound_system.set_volume(50)", realWorld: "A car dashboard—a simple interface that abstracts complex engine, electrical, and fuel systems underneath" },
  { name: "Proxy", category: "Structural", complexity: 2, problem: "Need to control access, cache, lazy-load, or log interactions with an object", when: "Caching, access control, lazy initialization, remote objects, rate limiting", avoid: "Direct access is fine and interception overhead isn't justified", example: "CachingProxy for Azure Doc Intelligence — return cached OCR results if doc unchanged", howItWorks: "Surrogate with same interface intercepts calls, performs logic (cache, auth), delegates to real object.", pairs: ["Decorator", "Adapter", "Lazy Initialization"], tags: ["caching", "access control", "lazy loading"] , python: "class CachingProxy:\n    def __init__(self, real_service):\n        self.service = real_service\n        self.cache = {}\n    def get_result(self, key):\n        if key not in self.cache:\n            self.cache[key] = self.service.compute(key)\n        return self.cache[key]", realWorld: "A security guard at a building entrance—they check credentials and control access before letting you see the actual office" },
  { name: "Decorator", category: "Structural", complexity: 2, problem: "Add behavior to objects dynamically without modifying them or subclassing", when: "Middleware chains, logging/auth/retry wrappers, feature layering", avoid: "Behavior is static and known at compile time", example: "LoggingDecorator(RetryDecorator(AuthDecorator(httpClient)))", howItWorks: "Wrapper classes implement same interface, add behavior before/after delegating. Stack arbitrarily.", pairs: ["Chain of Responsibility", "Proxy", "Strategy"], tags: ["middleware", "wrapper", "layering", "stacking"] , python: "def log(func):\n    def wrapper(*args):\n        print(f'Calling {func.__name__}')\n        return func(*args)\n    return wrapper\n@log\ndef save_forecast(): pass", realWorld: "Adding a frame to a painting—the original artwork is unchanged, but the frame adds presentation value" },
  { name: "Composite", category: "Structural", complexity: 2, problem: "Need to treat individual objects and groups of objects uniformly", when: "Tree structures — file systems, org charts, nested menus, UI trees, ASTs", avoid: "No hierarchical relationship exists", example: "ForecastGroup contains Forecasts or nested ForecastGroups, all support .evaluate()", howItWorks: "Component interface. Leaves implement directly. Composites hold children and delegate. Clients treat both identically.", pairs: ["Iterator", "Visitor", "Builder"], tags: ["tree", "hierarchy", "uniform", "recursive"] , python: "class FileSystem:\n    def add(self, child): self.children.append(child)\n    def get_size(self):\n        return sum(c.get_size() for c in self.children)\nroot = Folder()\nroot.add(File(100))\nroot.add(Folder([File(50)]))", realWorld: "A corporate organization—employees are individuals, departments contain multiple people, and divisions contain multiple departments" },
  { name: "Bridge", category: "Structural", complexity: 3, problem: "Abstraction and implementation need to vary independently along two axes", when: "Multi-platform rendering, multiple DB drivers × multiple query types", avoid: "Only one axis of variation — use Strategy or simple inheritance", example: "ForecastModel (ETS/ARIMA) × OutputFormat (JSON/CSV/Parquet) — vary independently", howItWorks: "Separate abstraction from implementation into two hierarchies connected by composition.", pairs: ["Adapter", "Strategy", "Abstract Factory"], tags: ["two dimensions", "platform", "decoupling"] , python: "class Shape:\n    def __init__(self, renderer):\n        self.renderer = renderer\n    def draw(self):\n        self.renderer.render_shape()\nclass Canvas(Shape): pass\nclass SVG(Shape): pass", realWorld: "A vehicle (car, truck) and an engine type (diesel, electric) vary independently—any combination works" },
  { name: "Flyweight", category: "Structural", complexity: 3, problem: "Too many similar objects consuming too much memory", when: "Rendering thousands of similar items, character formatting, game sprites", avoid: "No memory pressure from duplicate data", example: "Shared model metadata across 1000s of forecast instances — only time series differs", howItWorks: "Split state into intrinsic (shared) and extrinsic (unique). Share intrinsic in flyweight objects.", pairs: ["Composite", "Object Pool", "Singleton"], tags: ["memory", "sharing", "optimization"] , python: "class CharacterFormat:\n    def __init__(self, font, size, color):\n        self.font = font\n        self.size = size\nfmt_cache = {'Arial_12': CharacterFormat('Arial', 12, 'black')}\n# Reuse instead of create new", realWorld: "In a book, the word 'the' appears 1000 times but is stored once with references to it everywhere" },
  { name: "Module", category: "Structural", complexity: 1, problem: "Need to encapsulate related code and prevent namespace pollution", when: "Organizing large codebases, encapsulating private state, plugin systems", avoid: "Language already has strong module system and you're using it", example: "ES modules, Python packages — organizing forecast models into self-contained modules", howItWorks: "Group related code into a unit with clear public interface. Internal details hidden.", pairs: ["Facade", "Singleton"], tags: ["encapsulation", "namespace", "organization"] , python: "# math_utils.py\ndef add(a, b): return a + b\ndef multiply(a, b): return a * b\n# main.py\nimport math_utils\nresult = math_utils.add(1, 2)", realWorld: "Library sections—each section (fiction, reference, children) is self-contained with its own catalog system" },
  { name: "Strategy", category: "Behavioral", complexity: 1, problem: "Need to swap algorithms or behaviors at runtime without if-else chains", when: "Multiple algorithms for same task, user-selectable, A/B testing", avoid: "Only one algorithm — no variation needed", example: "ForecastStrategy: AutoETS vs AutoARIMA vs AutoTheta — inject at runtime", howItWorks: "Family of algorithms as separate classes with common interface. Context holds strategy reference, delegates.", pairs: ["Factory Method", "State", "Template Method"], tags: ["algorithm", "swap", "runtime", "polymorphism"] , python: "class SortStrategy:\n    def sort(self, data): pass\nclass QuickSort(SortStrategy):\n    def sort(self, data): pass\nclass MergeSort(SortStrategy):\n    def sort(self, data): pass\nsorter = Sorter(QuickSort())", realWorld: "Choosing your travel mode—walk, drive, bike, or fly—each has different speed and cost characteristics" },
  { name: "Observer", category: "Behavioral", complexity: 1, problem: "Objects need to be notified when another object's state changes", when: "Event systems, UI updates, pub-sub within a process, reactive data flows", avoid: "Simple direct method calls suffice, no fan-out needed", example: "ForecastCompleteEvent → notifies dashboard, triggers email, updates cache independently", howItWorks: "Subject maintains observer list. On state change, calls update() on each. Loose coupling.", pairs: ["Mediator", "Command", "Event Sourcing"], tags: ["events", "notification", "pub-sub", "reactive"] , python: "class Subject:\n    def __init__(self):\n        self.observers = []\n    def notify(self, event):\n        for obs in self.observers:\n            obs.update(event)\nsubject.attach(EmailObserver())\nsubject.notify('completed')", realWorld: "A Twitter account—multiple followers get notified when you post, without you having to manually contact each one" },
  { name: "Chain of Responsibility", category: "Behavioral", complexity: 2, problem: "Request should be processed by one or more handlers in sequence", when: "Middleware pipelines, validation chains, approval workflows", avoid: "You always know exactly which handler should process it", example: "NestJS/Express: RateLimit → Auth → Validate → Sanitize → Handler", howItWorks: "Each handler references the next. Processes and/or passes along. Chain assembled at config time.", pairs: ["Decorator", "Command", "Strategy"], tags: ["middleware", "pipeline", "handler", "sequential"] , python: "class Handler:\n    def __init__(self, next_handler=None):\n        self.next = next_handler\n    def handle(self, request):\n        if self._can_handle(request):\n            return self._do_handle(request)\n        return self.next.handle(request) if self.next else None", realWorld: "A customer service chain—Level 1 support tries to help, if they can't they escalate to Level 2, then Level 3" },
  { name: "Command", category: "Behavioral", complexity: 2, problem: "Need to encapsulate actions as objects for queuing, undo, logging, scheduling", when: "Undo/redo, task queues, macro recording, transactional operations", avoid: "Simple fire-and-forget with no need for history or queuing", example: "RunForecastCommand { accountId, model, params } — queued with retry and audit trail", howItWorks: "Wrap request as object with all info to perform action. Can be stored, queued, serialized, undone.", pairs: ["Memento", "Observer", "Chain of Responsibility"], tags: ["encapsulate action", "undo", "queue", "history"] , python: "class Command:\n    def execute(self): pass\nclass SaveCommand(Command):\n    def __init__(self, document):\n        self.document = document\n    def execute(self):\n        self.document.save()\ninvoker = CommandInvoker()\ninvoker.queue(SaveCommand(doc))", realWorld: "Restaurant orders—a waiter writes down your command, queues it, and the kitchen executes it in order" },
  { name: "State", category: "Behavioral", complexity: 2, problem: "Object behavior changes dramatically based on internal state", when: "Order lifecycle, document workflows, connection states, game entities", avoid: "Only 2-3 trivial states — simple enum and if-else is clearer", example: "ForecastJob: Queued → Preprocessing → Training → Validating → Complete/Failed", howItWorks: "Each state is a separate class with common interface. Context delegates to current state. Transitions swap state object.", pairs: ["Strategy", "Observer", "Memento"], tags: ["state machine", "lifecycle", "transitions", "workflow"] , python: "class OrderState:\n    def next_state(self): pass\nclass Pending(OrderState):\n    def next_state(self): return Processing()\norder.set_state(Pending())\norder.change_state()  # Pending -> Processing", realWorld: "A traffic light—red, yellow, green are distinct states with specific behaviors and transitions" },
  { name: "Template Method", category: "Behavioral", complexity: 1, problem: "Algorithm structure is fixed but individual steps need to vary", when: "ETL pipelines, test frameworks, report generators", avoid: "Steps don't share common structure — use Strategy instead", example: "BaseForecastPipeline: loadData() → preprocess() → train() → validate() — subclasses override steps", howItWorks: "Abstract base class defines algorithm skeleton. Some methods default, some abstract. Subclasses override steps.", pairs: ["Strategy", "Factory Method"], tags: ["skeleton", "algorithm", "hook", "pipeline"] , python: "class DataPipeline:\n    def process(self):\n        self.load()\n        self.transform()\n        self.validate()\n    def load(self): pass\n    def transform(self): pass\n    def validate(self): pass", realWorld: "A recipe for baking a cake—the steps are always the same, but ingredients and timing vary per recipe" },
  { name: "Mediator", category: "Behavioral", complexity: 2, problem: "Too many objects communicating directly creates tangled dependencies", when: "Chat systems, form interactions, complex UI coordination, orchestration", avoid: "Communication is already simple between few components", example: "ForecastOrchestrator mediates between DataLoader, ModelSelector, Validator, ResultPublisher", howItWorks: "Components communicate through central mediator. Each knows only mediator. Mediator encapsulates interaction logic.", pairs: ["Observer", "Facade", "Command"], tags: ["coordination", "decoupling", "hub", "orchestration"] , python: "class ChatRoom:\n    def __init__(self):\n        self.users = []\n    def send_message(self, from_user, msg):\n        for user in self.users:\n            if user != from_user:\n                user.receive(msg)", realWorld: "An air traffic control tower—pilots don't talk to each other directly, they all communicate through ATC" },
  { name: "Visitor", category: "Behavioral", complexity: 3, problem: "Need to add operations to a class hierarchy without modifying classes", when: "AST processing, report generation, compilers, heterogeneous collections", avoid: "Class hierarchy changes frequently — breaks every visitor", example: "MetricsVisitor computes MAPE, RMSE, SMAPE without modifying result classes", howItWorks: "Elements accept visitors. Visitor has visit method per element type. New operation = new visitor. Double dispatch.", pairs: ["Composite", "Iterator", "Strategy"], tags: ["double dispatch", "AST", "traversal", "open-closed"] , python: "class Node:\n    def accept(self, visitor):\n        visitor.visit(self)\nclass CountVisitor:\n    def visit(self, node):\n        self.count += 1", realWorld: "A building inspector visiting different rooms—each room accepts the inspector and shows relevant aspects" },
  { name: "Memento", category: "Behavioral", complexity: 2, problem: "Need to capture and restore object state without exposing internals", when: "Undo/redo, checkpointing, transaction rollback, save/load", avoid: "State is trivial, immutable, or history isn't needed", example: "Snapshot forecast config before tuning — rollback if results degrade", howItWorks: "Originator creates memento with state snapshot. Caretaker stores them. Restore from memento to undo.", pairs: ["Command", "State", "Prototype"], tags: ["snapshot", "undo", "checkpoint", "rollback"] , python: "class Document:\n    def __init__(self):\n        self.content = ''\n    def save(self):\n        return DocumentMemento(self.content)\n    def restore(self, memento):\n        self.content = memento.content", realWorld: "A Ctrl+Z undo feature in an editor—storing snapshots of previous states to restore them" },
  { name: "Iterator", category: "Behavioral", complexity: 1, problem: "Need to traverse a collection without exposing its internal structure", when: "Custom collections, lazy evaluation, streaming large datasets", avoid: "Language built-in iteration already covers your use case", example: "TimeSeriesIterator lazily yields chunks without loading entire dataset", howItWorks: "Common interface (hasNext/next) for traversal. Each collection provides its own iterator implementation.", pairs: ["Composite", "Visitor", "Factory Method"], tags: ["traversal", "collection", "lazy", "streaming"] , python: "class ListIterator:\n    def __init__(self, items):\n        self.items = items\n        self.index = 0\n    def has_next(self): return self.index < len(self.items)\n    def next(self): return self.items[self.index]\n    self.index += 1", realWorld: "A page-turner in a book—advancing one page at a time without exposing the entire binding" },
  { name: "Specification", category: "Behavioral", complexity: 2, problem: "Business rules scattered across code, hard to compose or reuse", when: "Complex filtering, validation rules, eligibility checks", avoid: "Rules are simple one-liners that don't need composition", example: "HighValueAccount.and(HasSufficientHistory).and(NotExcluded)", howItWorks: "Encapsulate rule as object with isSatisfiedBy(). Combine with and(), or(), not() for complex criteria.", pairs: ["Strategy", "Chain of Responsibility", "Repository"], tags: ["business rules", "composable", "filtering", "DDD"] , python: "class HighValueSpec:\n    def is_satisfied_by(self, customer):\n        return customer.revenue > 100000\nspec = HighValueSpec().and_spec(HasGoodHistory()).or_spec(NewPartner())", realWorld: "Job requirements—filtering candidates by combining multiple criteria (degree AND experience OR certifications)" },
  { name: "Null Object", category: "Behavioral", complexity: 1, problem: "Null checks everywhere cluttering code", when: "Default/no-op behavior needed, optional dependencies", avoid: "Null means something important callers must handle", example: "NullLogger silently ignores calls — no if(logger != null) checks", howItWorks: "Special implementation that does nothing. Same interface as real objects. No null checks needed.", pairs: ["Strategy", "State", "Factory Method"], tags: ["null safety", "default", "no-op", "clean code"] , python: "class Logger:\n    def log(self, msg): pass\nclass NullLogger(Logger):\n    def log(self, msg): pass  # Does nothing\nlogger = NullLogger()  # No null checks needed", realWorld: "A toy remote control with no batteries—it looks normal but has no effect when you press buttons" },
  { name: "Publish-Subscribe", category: "Behavioral", complexity: 2, problem: "Publishers and subscribers need full decoupling", when: "Event buses, message brokers, notification systems, microservice comms", avoid: "Direct method call is simpler and latency matters", example: "ForecastService publishes 'forecast.completed' — dashboard, cache, alerting subscribe independently", howItWorks: "Intermediary broker/bus. Publishers emit to topics. Subscribers register for topics. Neither knows the other.", pairs: ["Observer", "Event Sourcing", "Mediator"], tags: ["events", "decoupling", "broker", "async"] , python: "broker = EventBroker()\nbroker.subscribe('order.completed', email_handler)\nbroker.subscribe('order.completed', analytics_handler)\nbroker.publish('order.completed', order_data)", realWorld: "A newspaper—multiple people subscribe to different sections, and they all receive updates independently" },
  { name: "Interpreter", category: "Behavioral", complexity: 3, problem: "Need to evaluate sentences in a language or structured expressions", when: "DSLs, rule engines, expression parsers", avoid: "Complex language — use a proper parser generator", example: "ForecastRuleInterpreter: 'IF seasonality > 0.8 AND trend = upward THEN use ETS'", howItWorks: "Grammar as class hierarchy. Each rule/expression has interpret(). Terminals handle atoms, non-terminals compose.", pairs: ["Composite", "Visitor", "Strategy"], tags: ["DSL", "grammar", "parsing", "rule engine"] , python: "class Expression:\n    def interpret(self, context): pass\nclass Number(Expression):\n    def interpret(self, context): return self.value\nclass Add(Expression):\n    def interpret(self, context):\n        return self.left.interpret(context) + self.right.interpret(context)", realWorld: "A language translator—converting sentences from English to Spanish by interpreting grammatical rules" },
  { name: "Repository", category: "Data & Persistence", complexity: 2, problem: "Data access logic scattered throughout the application", when: "Abstracting DB access, testability, isolating persistence", avoid: "Simple scripts where direct DB access is fine", example: "ForecastRepository.findByAccount(id) — hides MongoDB vs Postgres vs cache", howItWorks: "Interface like in-memory collection (find, save, delete). Implementation handles persistence. Business logic uses interface.", pairs: ["Unit of Work", "Specification", "Factory Method"], tags: ["data access", "abstraction", "testability", "DDD"] , python: "class UserRepository:\n    def find_by_id(self, id):\n        return self.db.query('SELECT * FROM users WHERE id = %s', id)\n    def save(self, user):\n        self.db.insert('users', user.to_dict())", realWorld: "A library catalog system—you ask for a book by title, it finds it regardless of whether it's on shelf or in storage" },
  { name: "Unit of Work", category: "Data & Persistence", complexity: 2, problem: "Need to track changes across entities and commit atomically", when: "ORMs, batch operations, transactional consistency", avoid: "Single entity operations without atomic needs", example: "UnitOfWork tracks new forecasts, updated configs — commits all or rolls back all", howItWorks: "Maintains list of affected objects. Coordinates writing to DB — all succeed or all rollback.", pairs: ["Repository", "Command", "Saga"], tags: ["transaction", "atomic", "batch", "ORM"] , python: "class UnitOfWork:\n    def __init__(self):\n        self.new_objects = []\n        self.dirty_objects = []\n    def register_new(self, obj): self.new_objects.append(obj)\n    def commit(self):\n        self._insert_new()\n        self._update_dirty()", realWorld: "A bank teller processing multiple account changes—either all go through or all are rejected together" },
  { name: "DAO", category: "Data & Persistence", complexity: 1, problem: "Need clean separation between data access and business logic", when: "CRUD operations, abstracting SQL/NoSQL specifics", avoid: "Repository already covers your needs", example: "ForecastDAO: insert(), update(), delete(), findById()", howItWorks: "Dedicated object handles all data access for entity. Translates between domain and DB. CRUD-oriented.", pairs: ["Repository", "Factory Method", "Adapter"], tags: ["CRUD", "data access", "separation"] , python: "class UserDAO:\n    def create(self, user): pass\n    def find_by_id(self, id): pass\n    def update(self, user): pass\n    def delete(self, user_id): pass", realWorld: "A file clerk who handles all filing, retrieval, and organization of documents" },
  { name: "Active Record", category: "Data & Persistence", complexity: 1, problem: "Want objects that persist themselves — less boilerplate", when: "Simple CRUD, Rails/Django style, rapid prototyping", avoid: "Complex domain logic — mixes persistence with business", example: "forecast.save(), Forecast.findById(123)", howItWorks: "Domain objects contain persistence logic. Each maps to a DB row with find/save/update/delete.", pairs: ["Repository", "DAO"], tags: ["ORM", "Rails", "Django", "simple CRUD"] , python: "class User:\n    def save(self): pass\n    @staticmethod\n    def find_by_id(id): pass\nuser = User(name='John')\nuser.save()\nfound = User.find_by_id(1)", realWorld: "A business card that has your contact info and also knows how to save itself to a Rolodex" },
  { name: "Data Mapper", category: "Data & Persistence", complexity: 2, problem: "Domain objects should be ignorant of the database", when: "Complex domains, DDD, persistence ignorance needed", avoid: "Simple CRUD where Active Record is less work", example: "ForecastMapper translates between domain object and DB table — neither knows the other", howItWorks: "Separate mapper transfers data between domain objects and DB. Domain has no persistence code.", pairs: ["Repository", "Unit of Work", "Strategy"], tags: ["DDD", "persistence ignorance", "ORM"] , python: "class UserMapper:\n    def find_by_id(self, id):\n        row = self.db.find(id)\n        return User(row.name, row.email)\n    def save(self, user):\n        self.db.insert(user.to_row())", realWorld: "A translator between your native language and another—converting between two completely independent systems" },
  { name: "Identity Map", category: "Data & Persistence", complexity: 2, problem: "Same row loaded multiple times creates duplicate inconsistent objects", when: "ORMs, complex transactions loading from multiple paths", avoid: "Stateless requests with fresh data each time", example: "Loading Account #3010 from two queries returns same object reference", howItWorks: "Map of loaded objects keyed by identity. Check before loading. Each entity exists once per session.", pairs: ["Unit of Work", "Repository", "Data Mapper"], tags: ["caching", "consistency", "ORM", "deduplication"] , python: "class IdentityMap:\n    def __init__(self):\n        self.objects = {}\n    def add(self, id, obj):\n        self.objects[id] = obj\n    def get(self, id):\n        return self.objects.get(id)", realWorld: "A registration desk that checks if you're already registered before issuing a new badge" },
  { name: "CQRS", category: "Data & Persistence", complexity: 3, problem: "Read and write patterns have vastly different performance needs", when: "High read/write asymmetry, complex queries + simple writes", avoid: "Simple CRUD with balanced load — massive overkill", example: "Writes to normalized store, reads from denormalized materialized views", howItWorks: "Separate command (write) and query (read) sides with different models. Often synced via events.", pairs: ["Event Sourcing", "Saga", "Publish-Subscribe"], tags: ["read-write split", "performance", "event-driven"] , python: "# Write side\nclass CreateOrder(Command):\n    def handle(self): self.db.write_order(self.data)\n# Read side\nclass OrderView:\n    def get_by_date(self, date):\n        return self.cache.get(date)", realWorld: "A post office—one counter for mailing (write) and a different counter for tracking packages (read)" },
  { name: "Event Sourcing", category: "Data & Persistence", complexity: 3, problem: "Need complete audit trail, temporal queries, replay/rebuild state", when: "Financial systems, compliance, debugging state transitions", avoid: "Current state is all you need — adds enormous complexity", example: "Store every forecast parameter change as event — replay to audit drift", howItWorks: "Store sequence of state-changing events instead of current state. Derive state by replaying. Immutable, append-only.", pairs: ["CQRS", "Saga", "Publish-Subscribe"], tags: ["audit trail", "immutable", "replay", "compliance"] , python: "class EventStore:\n    def __init__(self):\n        self.events = []\n    def append(self, event):\n        self.events.append(event)\n    def replay(self):\n        state = {}\n        for event in self.events:\n            state = event.apply(state)\n        return state", realWorld: "A bank statement—instead of showing current balance, you see every transaction that created it" },
  { name: "Sidecar", category: "Infrastructure", complexity: 2, problem: "Cross-cutting concerns polluting business logic", when: "Service mesh, observability, security in Kubernetes", avoid: "Not using containers, or concern is library-simple", example: "Envoy sidecar handles mTLS, retries, tracing — service just does forecasting", howItWorks: "Helper container alongside main container in same pod. Intercepts traffic or provides aux services.", pairs: ["Ambassador", "Service Mesh", "Circuit Breaker"], tags: ["container", "Kubernetes", "observability"] , python: "# Main container runs the app\n# Sidecar container runs logging agent\n# Both share a volume for log files", realWorld: "A police officer riding in the sidecar of a motorcycle—provides support without altering the main vehicle" },
  { name: "Ambassador", category: "Infrastructure", complexity: 2, problem: "Service needs smart outbound connectivity", when: "DB connection pooling, external API proxying, legacy bridging", avoid: "Direct connection is reliable and simple", example: "Ambassador handles connection pooling to Cosmos DB from forecast workers", howItWorks: "Specialized sidecar as outbound proxy. Service talks to localhost, ambassador connects to remote.", pairs: ["Sidecar", "Circuit Breaker", "Proxy"], tags: ["outbound proxy", "connection pooling"] , python: "class ConnectionPool:\n    def __init__(self, host, port):\n        self.connections = []\n    def get(self):\n        return self.connections.pop()\n    def release(self, conn):\n        self.connections.append(conn)", realWorld: "A personal assistant who manages all your appointments and connections instead of you doing it directly" },
  { name: "Circuit Breaker", category: "Infrastructure", complexity: 2, problem: "Downstream failures cascade and take everything down", when: "Any cross-service call, external API dependencies", avoid: "Downstream is in-process or failure is acceptable", example: "Circuit breaker on Azure Doc Intelligence — fallback to cached extraction", howItWorks: "Track failures. Exceed threshold → OPEN (fallback). Cooldown → HALF-OPEN (test). Success → CLOSED.", pairs: ["Bulkhead", "Retry", "Timeout"], tags: ["resilience", "cascading failure", "fallback"] , python: "class CircuitBreaker:\n    def __init__(self, threshold=5):\n        self.failures = 0\n        self.threshold = threshold\n        self.state = 'CLOSED'\n    def call(self, func):\n        if self.state == 'OPEN':\n            raise Exception('Circuit open')\n        try:\n            return func()\n        except Exception:\n            self.failures += 1\n            if self.failures >= self.threshold:\n                self.state = 'OPEN'", realWorld: "A circuit breaker in your home—when too much current flows, it trips and cuts power to prevent fire" },
  { name: "Bulkhead", category: "Infrastructure", complexity: 2, problem: "One slow dependency exhausts shared resources and kills everything", when: "Multiple downstreams sharing thread/connection pools", avoid: "Single downstream, or resources aren't shared", example: "Separate thread pools: BizView can't starve batch processing", howItWorks: "Isolate resources per dependency. If one floods, others keep working. Separate thread/connection pools.", pairs: ["Circuit Breaker", "Sidecar", "Rate Limiter"], tags: ["isolation", "resource partitioning", "fault containment"] , python: "# Separate thread pools\nfast_pool = ThreadPoolExecutor(max_workers=10)\nslow_pool = ThreadPoolExecutor(max_workers=5)\n# Fast requests use fast_pool, slow use slow_pool", realWorld: "Compartments in a ship—a leak in one doesn't sink the whole vessel" },
  { name: "Retry", category: "Infrastructure", complexity: 1, problem: "Transient failures cause unnecessary errors", when: "HTTP calls, DB connections — any transient failure", avoid: "Non-idempotent operations, permanent failures", example: "Retry OCR 3 times with exponential backoff + jitter", howItWorks: "On failure, wait and retry. Exponential backoff + jitter. Max retries + timeout. Only transient errors.", pairs: ["Circuit Breaker", "Bulkhead", "Timeout"], tags: ["transient failure", "backoff", "resilience"] , python: "import time\ndef retry_with_backoff(func, max_attempts=3):\n    for attempt in range(max_attempts):\n        try:\n            return func()\n        except Exception:\n            if attempt < max_attempts - 1:\n                time.sleep(2 ** attempt)", realWorld: "Dialing a phone number when busy—you wait a bit and try again" },
  { name: "Timeout", category: "Infrastructure", complexity: 1, problem: "Slow dependencies hang indefinitely consuming resources", when: "Every external call. No exceptions.", avoid: "Never — always set timeouts", example: "5s timeout on model API — fail fast not hang 60s", howItWorks: "Max duration for operation. Cancel and return error/fallback if exceeded.", pairs: ["Circuit Breaker", "Retry", "Bulkhead"], tags: ["deadline", "fail fast", "always use"] , python: "import signal\ndef timeout_handler(signum, frame):\n    raise TimeoutError()\nsignal.signal(signal.SIGALRM, timeout_handler)\nsignal.alarm(5)\ntry:\n    result = slow_operation()\nfinally:\n    signal.alarm(0)", realWorld: "Setting a timer on the oven so it beeps if cooking takes too long" },
  { name: "Saga", category: "Infrastructure", complexity: 3, problem: "Need transaction-like guarantees across microservices", when: "Order flows spanning services, multi-step workflows", avoid: "Can keep in one DB — use regular ACID transactions", example: "Reserve compute → Run model → Store → Notify — compensate on failure", howItWorks: "Local transactions with compensating actions. Choreography (events) or Orchestration (coordinator).", pairs: ["CQRS", "Event Sourcing", "Outbox"], tags: ["distributed transaction", "compensation", "eventual consistency"] , python: "class OrderSaga:\n    def execute(self):\n        try:\n            self.reserve_inventory()\n            self.charge_payment()\n            self.ship_order()\n        except Exception:\n            self.compensate_inventory()\n            self.refund_payment()", realWorld: "A wedding ceremony—multiple vendors coordinate (catering, flowers, photography); if one cancels, you compensate" },
  { name: "Outbox", category: "Infrastructure", complexity: 3, problem: "Dual-write: need DB update AND event publish atomically", when: "Event-driven systems needing DB-broker consistency", avoid: "At-most-once delivery acceptable or no events", example: "Write forecast result + event to DB in one tx → relay publishes to Kafka", howItWorks: "Write data and event to DB in one transaction. Separate process publishes from outbox to broker.", pairs: ["Saga", "Event Sourcing", "Publish-Subscribe"], tags: ["atomicity", "dual write", "CDC", "Kafka"] , python: "class OutboxEntry:\n    def __init__(self, event):\n        self.event = event\n        self.published = False\n# Save order and outbox entry in one transaction\ndb.transaction(lambda: [\n    db.save(order),\n    db.save(OutboxEntry(OrderCreated(order)))\n])", realWorld: "Writing a memo and a letter together in one envelope—both go out at the same time" },
  { name: "Strangler Fig", category: "Infrastructure", complexity: 2, problem: "Legacy needs replacing but big-bang rewrite is too risky", when: "Monolith→microservices, platform modernization", avoid: "System small enough for clean rewrite", example: "Route new forecast types to new service, legacy types still hit old system", howItWorks: "Facade in front of legacy. New features → new system. Gradually migrate. Decommission old when empty.", pairs: ["API Gateway", "Facade", "Anti-Corruption Layer"], tags: ["migration", "legacy", "gradual", "low risk"] , python: "if is_new_feature(request):\n    return new_service.handle(request)\nelse:\n    return legacy_system.handle(request)", realWorld: "A strangler fig vine gradually wraps around a tree—eventually replaces it while it's still standing" },
  { name: "Anti-Corruption Layer", category: "Infrastructure", complexity: 2, problem: "Legacy/external system's bad model would pollute your domain", when: "Legacy integration, bad third-party APIs, bounded context boundaries", avoid: "External model is clean and compatible", example: "ACL translates BizView's legacy format into Zenith's clean domain model", howItWorks: "Translation layer between systems. Translates models, validates data. DDD bounded context strategy.", pairs: ["Adapter", "Facade", "Strangler Fig"], tags: ["DDD", "bounded context", "legacy", "isolation"] , python: "class LegacyAdapter:\n    def __init__(self, legacy_service):\n        self.service = legacy_service\n    def get_customer(self, id):\n        legacy_data = self.service.get_cust(id)\n        return Customer(legacy_data.name, legacy_data.phone)", realWorld: "A border customs agent who inspects and translates foreign goods before they enter your clean home" },
  { name: "API Gateway", category: "Infrastructure", complexity: 2, problem: "Clients need single entry point to multiple services", when: "Multiple microservices needing unified auth, routing, rate limiting", avoid: "Single backend — direct access simpler", example: "Gateway routes /forecast→Zenith, /accounts→BizView, handles auth", howItWorks: "Reverse proxy handling routing, auth, TLS, rate limiting, response aggregation.", pairs: ["BFF", "Circuit Breaker", "Rate Limiter"], tags: ["routing", "edge", "auth", "Kong", "NGINX"] , python: "class APIGateway:\n    def route(self, request):\n        if request.path.startswith('/forecast'):\n            return forecast_service.handle(request)\n        elif request.path.startswith('/account'):\n            return account_service.handle(request)", realWorld: "A security guard at a building lobby directing visitors to the correct floor and department" },
  { name: "BFF", category: "Infrastructure", complexity: 2, problem: "Different clients need different API shapes", when: "Mobile needs compact, web needs rich, third-party needs different schema", avoid: "One client type or trivial differences", example: "Mobile BFF: compact summary. Web BFF: full charts + metadata", howItWorks: "Backend for Frontend — separate backend per client type. Each aggregates and transforms optimally.", pairs: ["API Gateway", "Facade", "Adapter"], tags: ["client-specific", "mobile", "web", "aggregation"] , python: "class MobileBFF:
    def get_dashboard(self, user_id):
        return {}
        'summary': self.get_summary(user_id),
        'quick_actions': self.get_actions(user_id)
    },
  { name: "Service Mesh", category: "Infrastructure", complexity: 3, problem: "Service-to-service comms need consistent security, observability, traffic control", when: "Large deployments (50+ services), mTLS/tracing/canary everywhere", avoid: "Few services — API gateway suffices", example: "Istio handles retries, mTLS, tracing, canary across all services", howItWorks: "Sidecar proxies (data plane) managed by control plane. Handles mTLS, retries, load balancing transparently.", pairs: ["Sidecar", "Circuit Breaker", "API Gateway"], tags: ["Istio", "Linkerd", "mTLS", "observability"] , python: "# Istio sidecar proxy configuration\n# Each service gets an Envoy sidecar\n# Handles retries, mTLS, load balancing transparently", realWorld: "An air traffic control system that manages all planes' routing, altitude, and spacing without pilots needing to coordinate" },
  { name: "Rate Limiter", category: "Infrastructure", complexity: 2, problem: "System overwhelmed by too many requests", when: "Public APIs, multi-tenant, abuse prevention", avoid: "Internal service with trusted callers", example: "100 forecast requests/min per tenant — prevent one from degrading others", howItWorks: "Track counts per client. Token bucket, sliding window, or leaky bucket. 429 + Retry-After.", pairs: ["API Gateway", "Bulkhead", "Circuit Breaker"], tags: ["throttling", "fairness", "multi-tenant"] , python: "class TokenBucket:\n    def __init__(self, capacity, refill_rate):\n        self.tokens = capacity\n        self.capacity = capacity\n        self.refill_rate = refill_rate\n    def is_allowed(self):\n        self.tokens = min(self.capacity, self.tokens + self.refill_rate)\n        if self.tokens >= 1:\n            self.tokens -= 1\n            return True\n        return False", realWorld: "An amusement park issuing limited ride tickets per hour—everyone's treated fairly" },
  { name: "Leader Election", category: "Infrastructure", complexity: 3, problem: "Distributed instances need coordination — only one should act", when: "Scheduled jobs, DB migrations, singleton processes in cluster", avoid: "Single instance or all can safely run", example: "One instance runs nightly retraining — others standby", howItWorks: "Instances compete for lock (ZooKeeper, Redis, DB). Winner is leader. Others monitor. Re-elect on failure.", pairs: ["Singleton", "Circuit Breaker"], tags: ["distributed lock", "coordination", "consensus"] , python: "class LeaderElection:\n    def __init__(self, candidates):\n        self.candidates = candidates\n    def elect_leader(self):\n        for candidate in self.candidates:\n            if candidate.acquire_lock():\n                return candidate\n        return None", realWorld: "A school election—candidates run, votes are counted, and one person becomes the representative" },
  { name: "Sharding", category: "Infrastructure", complexity: 3, problem: "Single DB can't handle data volume or throughput", when: "Massive datasets, write-heavy, multi-tenant isolation", avoid: "Data fits in one DB with acceptable performance", example: "Shard forecast data by region — US on one cluster, EU on another", howItWorks: "Partition across multiple DB instances by shard key. Routing layer directs queries.", pairs: ["CQRS", "API Gateway"], tags: ["horizontal scaling", "partitioning", "database"] , python: "class ShardRouter:\n    def get_shard(self, user_id):\n        shard_id = user_id % NUM_SHARDS\n        return self.shards[shard_id]\n    def save(self, user):\n        shard = self.get_shard(user.id)\n        shard.save(user)", realWorld: "A library with multiple branches—each branch has different books based on geography to reduce load" },
  { name: "Health Check", category: "Infrastructure", complexity: 1, problem: "Need to know if a service is alive and ready for traffic", when: "Any production service — Kubernetes liveness/readiness", avoid: "Never — always implement health checks", example: "/health/live → process alive. /health/ready → deps connected", howItWorks: "HTTP endpoints reporting health. Liveness (restart if not). Readiness (remove from LB if not).", pairs: ["Circuit Breaker", "Service Mesh"], tags: ["Kubernetes", "liveness", "readiness", "always use"] , python: "class HealthCheck:\n    @app.route('/health/live')\n    def liveness(self):\n        return {}, 200  # Process is alive\n    @app.route('/health/ready')\n    def readiness(self):\n        if self.db.connected:\n            return {}, 200\n        return {}, 503  # Not ready", realWorld: "A hospital's vital signs monitor—heart rate tells if patient is alive, blood pressure tells if they're healthy" },
  { name: "Cache-Aside", category: "Caching", complexity: 1, problem: "Frequent reads to slow source — need caching", when: "Read-heavy workloads, DB queries, API responses", avoid: "Data changes so frequently cache is always stale", example: "Check Redis → miss → query DB → store with TTL → return", howItWorks: "App checks cache. Miss → load from source, write to cache. Write → update source, invalidate cache.", pairs: ["Repository", "Proxy", "CQRS"], tags: ["Redis", "read-heavy", "TTL", "lazy loading"] , python: "class Cache:\n    def get(self, key):\n        if key in self.data:\n            return self.data[key]\n        value = self.db.get(key)\n        self.data[key] = value\n        return value", realWorld: "Keeping frequently used items on your desk—check desk first, if not there go to the filing cabinet" },
  { name: "Write-Through", category: "Caching", complexity: 2, problem: "Cache and DB must always be consistent", when: "Financial data, inventory — consistency > latency", avoid: "Write latency is critical", example: "Every write updates cache AND DB synchronously", howItWorks: "Every write updates both cache and source synchronously. Reads always from cache. Always fresh.", pairs: ["Cache-Aside", "Repository"], tags: ["consistency", "synchronous", "always fresh"] , python: "class WriteThrough:\n    def set(self, key, value):\n        self.cache.set(key, value)\n        self.db.set(key, value)\n    def get(self, key):\n        return self.cache.get(key)", realWorld: "A bank teller updating both the customer's passbook and the bank's ledger for every transaction" },
  { name: "Write-Behind", category: "Caching", complexity: 3, problem: "Need fast writes AND caching but sync writes too slow", when: "High write throughput, analytics ingestion", avoid: "Data loss on cache failure unacceptable", example: "Telemetry to cache immediately, flush to DB in batches", howItWorks: "Write to cache only. Background flush to source in batches. Fast but risks data loss.", pairs: ["Cache-Aside", "Outbox"], tags: ["async", "batch", "high throughput"] , python: "class WriteBehind:\n    def set(self, key, value):\n        self.cache.set(key, value)\n        self.queue_for_db(key, value)\n    def flush_to_db(self):\n        while not self.queue.empty():\n            key, value = self.queue.get()\n            self.db.set(key, value)", realWorld: "Writing checks that clear the bank 3-5 business days later instead of immediately" },
  { name: "Read-Through", category: "Caching", complexity: 2, problem: "Want cache to handle its own loading transparently", when: "Cache library supports it, reduce scattered miss logic", avoid: "Need custom miss behavior per call site", example: "Redis with loader function — misses auto-fetch from DB", howItWorks: "Cache calls configured loader on miss. App just reads from cache. Transparent loading.", pairs: ["Cache-Aside", "Write-Through"], tags: ["transparent", "auto-load", "simplification"] , python: "class ReadThrough:\n    def __init__(self, db, loader_func):\n        self.cache = {}\n        self.db = db\n        self.loader = loader_func\n    def get(self, key):\n        if key not in self.cache:\n            self.cache[key] = self.loader(key)\n        return self.cache[key]", realWorld: "A librarian who automatically fetches and shelves books when you ask, without you visiting the storage room" },
  { name: "MVC", category: "Architectural", complexity: 1, problem: "UI, business logic, and data tangled together", when: "Web apps, desktop apps with UI layer", avoid: "No UI or framework enforces separation", example: "Controller→Model→View: Rails, Django, Spring MVC", howItWorks: "Model (data+logic), View (display), Controller (input+coordination). Changes isolated.", pairs: ["Observer", "Strategy", "Template Method"], tags: ["separation of concerns", "web framework", "UI"] , python: "class Model:\n    def __init__(self):\n        self.data = []\nclass View:\n    def render(self, data):\n        return f'<ul>{data}</ul>'\nclass Controller:\n    def __init__(self, model, view):\n        self.model = model\n        self.view = view\n    def add_item(self, item):\n        self.model.data.append(item)", realWorld: "A restaurant—the kitchen (model) prepares food, the waiter (controller) takes orders, the plate (view) presents it" },
  { name: "MVP", category: "Architectural", complexity: 2, problem: "Need testable presentation logic", when: "Android, desktop apps, unit testing presentation", avoid: "Web where MVC/MVVM is convention", example: "Presenter has all logic, no framework deps. View is passive.", howItWorks: "Presenter references View via interface. View passive — only displays. Presenter fully testable.", pairs: ["Observer", "Strategy"], tags: ["testable", "presentation", "Android"] , python: "class Model:\n    def get_data(self): pass\nclass View:\n    def show(self, data): pass\nclass Presenter:\n    def __init__(self, model, view):\n        self.model = model\n        self.view = view\n    def on_button_click(self):\n        data = self.model.get_data()\n        self.view.show(data)", realWorld: "A TV show where the actor (presenter) handles all the acting while the camera (view) just records passively" },
  { name: "MVVM", category: "Architectural", complexity: 2, problem: "Need two-way data binding between UI and logic", when: "React, Angular, Vue, WPF, SwiftUI", avoid: "Server-rendered templates", example: "ViewModel exposes observable state → View binds → auto-updates", howItWorks: "ViewModel exposes data for binding. View binds declaratively. Changes flow through binding.", pairs: ["Observer", "Command", "Strategy"], tags: ["data binding", "React", "Angular", "Vue"] , python: "class ViewModel:\n    def __init__(self):\n        self.name = Observable('John')\n        self.age = Observable(30)\nclass View:\n    def __init__(self, viewmodel):\n        self.viewmodel = viewmodel\n        self.name_input.bind(self.viewmodel.name)", realWorld: "A thermostat where the display binds directly to the temperature sensor—when one changes, the other updates" },
  { name: "Hexagonal Architecture", category: "Architectural", complexity: 2, problem: "Business logic coupled to frameworks, databases, external services", when: "Complex domain needing framework-agnostic testability", avoid: "Simple CRUD where overhead isn't justified", example: "Domain knows nothing about HTTP, MongoDB, Azure — ports and adapters separate them", howItWorks: "Ports and Adapters. Domain at center with port interfaces. Adapters plug in for specific tech.", pairs: ["Repository", "Adapter", "Dependency Injection"], tags: ["ports and adapters", "testability", "DDD"] , python: "# Domain layer\nclass ForecastService:\n    def generate(self, params): pass\n# Port (interface)\nclass ForecastRepository:\n    def save(self, forecast): pass\n# Adapter\nclass MongoDBRepository(ForecastRepository):\n    def save(self, forecast):\n        self.db.insert(forecast.to_dict())", realWorld: "A control room with input jacks and output jacks—the control center doesn't care what's plugged in" },
  { name: "Clean Architecture", category: "Architectural", complexity: 3, problem: "Dependencies point wrong direction — business depends on infrastructure", when: "Large apps with complex domain, long-lived projects", avoid: "Small projects, rapid prototypes", example: "Entities → Use Cases → Adapters → Frameworks. Inner never references outer.", howItWorks: "Concentric layers. Dependency rule: inner knows nothing about outer. Always point inward.", pairs: ["Repository", "Adapter", "Dependency Injection"], tags: ["Uncle Bob", "dependency rule", "layers"] , python: "# Entities (innermost)\nclass Forecast:\n    pass\n# Use Cases\nclass GenerateForecast:\n    def execute(self, input): pass\n# Controllers (outermost)\nclass ForecastController:\n    def post(self):\n        use_case = GenerateForecast()\n        return use_case.execute()", realWorld: "Concentric circles of an onion—peel away layers without the inner layers knowing about outer ones" },
  { name: "Event-Driven Architecture", category: "Architectural", complexity: 2, problem: "Tightly coupled synchronous calls create brittle chains", when: "Async workflows, eventual consistency acceptable", avoid: "Strong consistency required, simple request-response sufficient", example: "Services emit events (ForecastRequested, ModelTrained) — others react independently", howItWorks: "Services communicate through event broker (Kafka, EventBridge). Loosely coupled, independently scalable.", pairs: ["Publish-Subscribe", "CQRS", "Event Sourcing", "Saga"], tags: ["Kafka", "async", "decoupling", "reactive"] , python: "broker = EventBroker()\nbroker.emit('OrderCreated', {...})\nbroker.on('OrderCreated', lambda event: send_email(event))\nbroker.on('OrderCreated', lambda event: update_analytics(event))", realWorld: "A town announcement system—the mayor announces news, and multiple departments (fire, police, health) react independently" },
