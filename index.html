<script type="text/babel">
const { useState, useMemo, useCallback } = React;

// ═══════════════════════════════════════════════
// PATTERN DATA (62 patterns)
// ═══════════════════════════════════════════════
const patterns = [
  { name: "Factory Method", category: "Creational", complexity: 1, problem: "You need to create objects but don't know the exact type until runtime", when: "Multiple implementations of an interface, type depends on config/input", avoid: "Only one implementation exists — just use new directly", example: "StorageClientFactory → S3Client or AzureBlobClient based on env config", howItWorks: "Define an interface for creating objects. Subclasses or config decide which concrete class to instantiate. Caller works with the interface, never the concrete type.", pairs: ["Strategy", "Abstract Factory", "Template Method"], tags: ["creation", "polymorphism", "loose coupling", "runtime decision"] },
  { name: "Abstract Factory", category: "Creational", complexity: 2, problem: "You need families of related objects that must be used together consistently", when: "Cross-platform UI toolkits, themed component systems, multi-cloud SDKs", avoid: "You only have one product family — use simple Factory", example: "CloudProviderFactory → creates matching Compute + Storage + Queue for AWS or Azure", howItWorks: "A factory interface declares creation methods for each product type. Concrete factories produce matching product families.", pairs: ["Factory Method", "Builder", "Singleton"], tags: ["families", "consistency", "platform"] },
  { name: "Builder", category: "Creational", complexity: 1, problem: "Complex object construction with many optional parameters or steps", when: "Constructors with 5+ params, fluent APIs, query builders, config objects", avoid: "Object is simple with few fields — constructor is fine", example: "ForecastConfigBuilder.model('ets').horizon(30).frequency('daily').seasonality(true).build()", howItWorks: "Separate construction from representation. A builder accumulates parameters through chained calls, then produces the final object in build().", pairs: ["Factory Method", "Prototype", "Composite"], tags: ["fluent", "construction", "configuration"] },
  { name: "Singleton", category: "Creational", complexity: 1, problem: "Need exactly one instance shared globally across the application", when: "Connection pools, loggers, config managers, hardware interfaces", avoid: "Almost always — prefer dependency injection. Singletons are global state in disguise", example: "DatabasePool.getInstance() — but a DI container managing lifecycle is usually better", howItWorks: "Class controls its own instantiation with a private constructor and a static method returning the same instance.", pairs: ["Factory Method", "Abstract Factory"], tags: ["global", "shared state", "anti-pattern risk"] },
  { name: "Prototype", category: "Creational", complexity: 1, problem: "Creating objects is expensive, but cloning an existing one is cheap", when: "Deep-copying config templates, document templates, game entities", avoid: "Objects are cheap to create or rarely need duplication", example: "Clone a base forecast config template and tweak parameters per account", howItWorks: "Objects implement clone() that creates a deep copy. New instances by copying a prototype rather than constructors.", pairs: ["Builder", "Factory Method", "Memento"], tags: ["clone", "copy", "template", "expensive creation"] },
  { name: "Object Pool", category: "Creational", complexity: 2, problem: "Creating and destroying objects is expensive and happens frequently", when: "Database connections, thread pools, network sockets, game objects", avoid: "Object creation is cheap, or pool management overhead isn't justified", example: "ConnectionPool pre-creates 20 DB connections, hands them out on request, reclaims on release", howItWorks: "Maintain a pool of initialized objects. Clients check out and return. Pool manages lifecycle, limits, and health.", pairs: ["Singleton", "Flyweight", "Factory Method"], tags: ["reuse", "performance", "connection pool"] },
  { name: "Lazy Initialization", category: "Creational", complexity: 1, problem: "Expensive resources are created upfront but may never be used", when: "Heavy objects not always needed, conditional feature loading", avoid: "Object is always needed, or creation is cheap", example: "ML model loaded into memory only when first forecast request arrives, not at startup", howItWorks: "Defer creation until first access. Null check — if null, create; otherwise return existing.", pairs: ["Proxy", "Singleton", "Factory Method"], tags: ["deferred", "performance", "startup time"] },

  { name: "Adapter", category: "Structural", complexity: 1, problem: "Incompatible interfaces need to work together", when: "Integrating legacy APIs, third-party libs, format translation, API versioning", avoid: "You control both interfaces — just refactor directly", example: "Wrap Azure Doc Intelligence XML response into your standard JSON schema", howItWorks: "Wrapper class translates the interface of an existing class into what the client expects.", pairs: ["Facade", "Bridge", "Decorator"], tags: ["integration", "legacy", "wrapper", "translation"] },
  { name: "Facade", category: "Structural", complexity: 1, problem: "Subsystem is complex, callers need a simple unified entry point", when: "Library wrappers, API simplification, hiding internal complexity", avoid: "Subsystem is already simple, or callers need fine-grained control", example: "ForecastService.predict(accountId) hides model selection, preprocessing, validation", howItWorks: "Single simplified class delegates to appropriate subsystem components.", pairs: ["Adapter", "Mediator", "Singleton"], tags: ["simplification", "API", "entry point"] },
  { name: "Proxy", category: "Structural", complexity: 2, problem: "Need to control access, cache, lazy-load, or log interactions with an object", when: "Caching, access control, lazy initialization, remote objects, rate limiting", avoid: "Direct access is fine and interception overhead isn't justified", example: "CachingProxy for Azure Doc Intelligence — return cached OCR results if doc unchanged", howItWorks: "Surrogate with same interface intercepts calls, performs logic (cache, auth), delegates to real object.", pairs: ["Decorator", "Adapter", "Lazy Initialization"], tags: ["caching", "access control", "lazy loading"] },
  { name: "Decorator", category: "Structural", complexity: 2, problem: "Add behavior to objects dynamically without modifying them or subclassing", when: "Middleware chains, logging/auth/retry wrappers, feature layering", avoid: "Behavior is static and known at compile time", example: "LoggingDecorator(RetryDecorator(AuthDecorator(httpClient)))", howItWorks: "Wrapper classes implement same interface, add behavior before/after delegating. Stack arbitrarily.", pairs: ["Chain of Responsibility", "Proxy", "Strategy"], tags: ["middleware", "wrapper", "layering", "stacking"] },
  { name: "Composite", category: "Structural", complexity: 2, problem: "Need to treat individual objects and groups of objects uniformly", when: "Tree structures — file systems, org charts, nested menus, UI trees, ASTs", avoid: "No hierarchical relationship exists", example: "ForecastGroup contains Forecasts or nested ForecastGroups, all support .evaluate()", howItWorks: "Component interface. Leaves implement directly. Composites hold children and delegate. Clients treat both identically.", pairs: ["Iterator", "Visitor", "Builder"], tags: ["tree", "hierarchy", "uniform", "recursive"] },
  { name: "Bridge", category: "Structural", complexity: 3, problem: "Abstraction and implementation need to vary independently along two axes", when: "Multi-platform rendering, multiple DB drivers × multiple query types", avoid: "Only one axis of variation — use Strategy or simple inheritance", example: "ForecastModel (ETS/ARIMA) × OutputFormat (JSON/CSV/Parquet) — vary independently", howItWorks: "Separate abstraction from implementation into two hierarchies connected by composition.", pairs: ["Adapter", "Strategy", "Abstract Factory"], tags: ["two dimensions", "platform", "decoupling"] },
  { name: "Flyweight", category: "Structural", complexity: 3, problem: "Too many similar objects consuming too much memory", when: "Rendering thousands of similar items, character formatting, game sprites", avoid: "No memory pressure from duplicate data", example: "Shared model metadata across 1000s of forecast instances — only time series differs", howItWorks: "Split state into intrinsic (shared) and extrinsic (unique). Share intrinsic in flyweight objects.", pairs: ["Composite", "Object Pool", "Singleton"], tags: ["memory", "sharing", "optimization"] },
  { name: "Module", category: "Structural", complexity: 1, problem: "Need to encapsulate related code and prevent namespace pollution", when: "Organizing large codebases, encapsulating private state, plugin systems", avoid: "Language already has strong module system and you're using it", example: "ES modules, Python packages — organizing forecast models into self-contained modules", howItWorks: "Group related code into a unit with clear public interface. Internal details hidden.", pairs: ["Facade", "Singleton"], tags: ["encapsulation", "namespace", "organization"] },

  { name: "Strategy", category: "Behavioral", complexity: 1, problem: "Need to swap algorithms or behaviors at runtime without if-else chains", when: "Multiple algorithms for same task, user-selectable, A/B testing", avoid: "Only one algorithm — no variation needed", example: "ForecastStrategy: AutoETS vs AutoARIMA vs AutoTheta — inject at runtime", howItWorks: "Family of algorithms as separate classes with common interface. Context holds strategy reference, delegates.", pairs: ["Factory Method", "State", "Template Method"], tags: ["algorithm", "swap", "runtime", "polymorphism"] },
  { name: "Observer", category: "Behavioral", complexity: 1, problem: "Objects need to be notified when another object's state changes", when: "Event systems, UI updates, pub-sub within a process, reactive data flows", avoid: "Simple direct method calls suffice, no fan-out needed", example: "ForecastCompleteEvent → notifies dashboard, triggers email, updates cache independently", howItWorks: "Subject maintains observer list. On state change, calls update() on each. Loose coupling.", pairs: ["Mediator", "Command", "Event Sourcing"], tags: ["events", "notification", "pub-sub", "reactive"] },
  { name: "Chain of Responsibility", category: "Behavioral", complexity: 2, problem: "Request should be processed by one or more handlers in sequence", when: "Middleware pipelines, validation chains, approval workflows", avoid: "You always know exactly which handler should process it", example: "NestJS/Express: RateLimit → Auth → Validate → Sanitize → Handler", howItWorks: "Each handler references the next. Processes and/or passes along. Chain assembled at config time.", pairs: ["Decorator", "Command", "Strategy"], tags: ["middleware", "pipeline", "handler", "sequential"] },
  { name: "Command", category: "Behavioral", complexity: 2, problem: "Need to encapsulate actions as objects for queuing, undo, logging, scheduling", when: "Undo/redo, task queues, macro recording, transactional operations", avoid: "Simple fire-and-forget with no need for history or queuing", example: "RunForecastCommand { accountId, model, params } — queued with retry and audit trail", howItWorks: "Wrap request as object with all info to perform action. Can be stored, queued, serialized, undone.", pairs: ["Memento", "Observer", "Chain of Responsibility"], tags: ["encapsulate action", "undo", "queue", "history"] },
  { name: "State", category: "Behavioral", complexity: 2, problem: "Object behavior changes dramatically based on internal state", when: "Order lifecycle, document workflows, connection states, game entities", avoid: "Only 2-3 trivial states — simple enum and if-else is clearer", example: "ForecastJob: Queued → Preprocessing → Training → Validating → Complete/Failed", howItWorks: "Each state is a separate class with common interface. Context delegates to current state. Transitions swap state object.", pairs: ["Strategy", "Observer", "Memento"], tags: ["state machine", "lifecycle", "transitions", "workflow"] },
  { name: "Template Method", category: "Behavioral", complexity: 1, problem: "Algorithm structure is fixed but individual steps need to vary", when: "ETL pipelines, test frameworks, report generators", avoid: "Steps don't share common structure — use Strategy instead", example: "BaseForecastPipeline: loadData() → preprocess() → train() → validate() — subclasses override steps", howItWorks: "Abstract base class defines algorithm skeleton. Some methods default, some abstract. Subclasses override steps.", pairs: ["Strategy", "Factory Method"], tags: ["skeleton", "algorithm", "hook", "pipeline"] },
  { name: "Mediator", category: "Behavioral", complexity: 2, problem: "Too many objects communicating directly creates tangled dependencies", when: "Chat systems, form interactions, complex UI coordination, orchestration", avoid: "Communication is already simple between few components", example: "ForecastOrchestrator mediates between DataLoader, ModelSelector, Validator, ResultPublisher", howItWorks: "Components communicate through central mediator. Each knows only mediator. Mediator encapsulates interaction logic.", pairs: ["Observer", "Facade", "Command"], tags: ["coordination", "decoupling", "hub", "orchestration"] },
  { name: "Visitor", category: "Behavioral", complexity: 3, problem: "Need to add operations to a class hierarchy without modifying classes", when: "AST processing, report generation, compilers, heterogeneous collections", avoid: "Class hierarchy changes frequently — breaks every visitor", example: "MetricsVisitor computes MAPE, RMSE, SMAPE without modifying result classes", howItWorks: "Elements accept visitors. Visitor has visit method per element type. New operation = new visitor. Double dispatch.", pairs: ["Composite", "Iterator", "Strategy"], tags: ["double dispatch", "AST", "traversal", "open-closed"] },
  { name: "Memento", category: "Behavioral", complexity: 2, problem: "Need to capture and restore object state without exposing internals", when: "Undo/redo, checkpointing, transaction rollback, save/load", avoid: "State is trivial, immutable, or history isn't needed", example: "Snapshot forecast config before tuning — rollback if results degrade", howItWorks: "Originator creates memento with state snapshot. Caretaker stores them. Restore from memento to undo.", pairs: ["Command", "State", "Prototype"], tags: ["snapshot", "undo", "checkpoint", "rollback"] },
  { name: "Iterator", category: "Behavioral", complexity: 1, problem: "Need to traverse a collection without exposing its internal structure", when: "Custom collections, lazy evaluation, streaming large datasets", avoid: "Language built-in iteration already covers your use case", example: "TimeSeriesIterator lazily yields chunks without loading entire dataset", howItWorks: "Common interface (hasNext/next) for traversal. Each collection provides its own iterator implementation.", pairs: ["Composite", "Visitor", "Factory Method"], tags: ["traversal", "collection", "lazy", "streaming"] },
  { name: "Specification", category: "Behavioral", complexity: 2, problem: "Business rules scattered across code, hard to compose or reuse", when: "Complex filtering, validation rules, eligibility checks", avoid: "Rules are simple one-liners that don't need composition", example: "HighValueAccount.and(HasSufficientHistory).and(NotExcluded)", howItWorks: "Encapsulate rule as object with isSatisfiedBy(). Combine with and(), or(), not() for complex criteria.", pairs: ["Strategy", "Chain of Responsibility", "Repository"], tags: ["business rules", "composable", "filtering", "DDD"] },
  { name: "Null Object", category: "Behavioral", complexity: 1, problem: "Null checks everywhere cluttering code", when: "Default/no-op behavior needed, optional dependencies", avoid: "Null means something important callers must handle", example: "NullLogger silently ignores calls — no if(logger != null) checks", howItWorks: "Special implementation that does nothing. Same interface as real objects. No null checks needed.", pairs: ["Strategy", "State", "Factory Method"], tags: ["null safety", "default", "no-op", "clean code"] },
  { name: "Publish-Subscribe", category: "Behavioral", complexity: 2, problem: "Publishers and subscribers need full decoupling", when: "Event buses, message brokers, notification systems, microservice comms", avoid: "Direct method call is simpler and latency matters", example: "ForecastService publishes 'forecast.completed' — dashboard, cache, alerting subscribe independently", howItWorks: "Intermediary broker/bus. Publishers emit to topics. Subscribers register for topics. Neither knows the other.", pairs: ["Observer", "Event Sourcing", "Mediator"], tags: ["events", "decoupling", "broker", "async"] },
  { name: "Interpreter", category: "Behavioral", complexity: 3, problem: "Need to evaluate sentences in a language or structured expressions", when: "DSLs, rule engines, expression parsers", avoid: "Complex language — use a proper parser generator", example: "ForecastRuleInterpreter: 'IF seasonality > 0.8 AND trend = upward THEN use ETS'", howItWorks: "Grammar as class hierarchy. Each rule/expression has interpret(). Terminals handle atoms, non-terminals compose.", pairs: ["Composite", "Visitor", "Strategy"], tags: ["DSL", "grammar", "parsing", "rule engine"] },

  { name: "Repository", category: "Data & Persistence", complexity: 2, problem: "Data access logic scattered throughout the application", when: "Abstracting DB access, testability, isolating persistence", avoid: "Simple scripts where direct DB access is fine", example: "ForecastRepository.findByAccount(id) — hides MongoDB vs Postgres vs cache", howItWorks: "Interface like in-memory collection (find, save, delete). Implementation handles persistence. Business logic uses interface.", pairs: ["Unit of Work", "Specification", "Factory Method"], tags: ["data access", "abstraction", "testability", "DDD"] },
  { name: "Unit of Work", category: "Data & Persistence", complexity: 2, problem: "Need to track changes across entities and commit atomically", when: "ORMs, batch operations, transactional consistency", avoid: "Single entity operations without atomic needs", example: "UnitOfWork tracks new forecasts, updated configs — commits all or rolls back all", howItWorks: "Maintains list of affected objects. Coordinates writing to DB — all succeed or all rollback.", pairs: ["Repository", "Command", "Saga"], tags: ["transaction", "atomic", "batch", "ORM"] },
  { name: "DAO", category: "Data & Persistence", complexity: 1, problem: "Need clean separation between data access and business logic", when: "CRUD operations, abstracting SQL/NoSQL specifics", avoid: "Repository already covers your needs", example: "ForecastDAO: insert(), update(), delete(), findById()", howItWorks: "Dedicated object handles all data access for entity. Translates between domain and DB. CRUD-oriented.", pairs: ["Repository", "Factory Method", "Adapter"], tags: ["CRUD", "data access", "separation"] },
  { name: "Active Record", category: "Data & Persistence", complexity: 1, problem: "Want objects that persist themselves — less boilerplate", when: "Simple CRUD, Rails/Django style, rapid prototyping", avoid: "Complex domain logic — mixes persistence with business", example: "forecast.save(), Forecast.findById(123)", howItWorks: "Domain objects contain persistence logic. Each maps to a DB row with find/save/update/delete.", pairs: ["Repository", "DAO"], tags: ["ORM", "Rails", "Django", "simple CRUD"] },
  { name: "Data Mapper", category: "Data & Persistence", complexity: 2, problem: "Domain objects should be ignorant of the database", when: "Complex domains, DDD, persistence ignorance needed", avoid: "Simple CRUD where Active Record is less work", example: "ForecastMapper translates between domain object and DB table — neither knows the other", howItWorks: "Separate mapper transfers data between domain objects and DB. Domain has no persistence code.", pairs: ["Repository", "Unit of Work", "Strategy"], tags: ["DDD", "persistence ignorance", "ORM"] },
  { name: "Identity Map", category: "Data & Persistence", complexity: 2, problem: "Same row loaded multiple times creates duplicate inconsistent objects", when: "ORMs, complex transactions loading from multiple paths", avoid: "Stateless requests with fresh data each time", example: "Loading Account #3010 from two queries returns same object reference", howItWorks: "Map of loaded objects keyed by identity. Check before loading. Each entity exists once per session.", pairs: ["Unit of Work", "Repository", "Data Mapper"], tags: ["caching", "consistency", "ORM", "deduplication"] },
  { name: "CQRS", category: "Data & Persistence", complexity: 3, problem: "Read and write patterns have vastly different performance needs", when: "High read/write asymmetry, complex queries + simple writes", avoid: "Simple CRUD with balanced load — massive overkill", example: "Writes to normalized store, reads from denormalized materialized views", howItWorks: "Separate command (write) and query (read) sides with different models. Often synced via events.", pairs: ["Event Sourcing", "Saga", "Publish-Subscribe"], tags: ["read-write split", "performance", "event-driven"] },
  { name: "Event Sourcing", category: "Data & Persistence", complexity: 3, problem: "Need complete audit trail, temporal queries, replay/rebuild state", when: "Financial systems, compliance, debugging state transitions", avoid: "Current state is all you need — adds enormous complexity", example: "Store every forecast parameter change as event — replay to audit drift", howItWorks: "Store sequence of state-changing events instead of current state. Derive state by replaying. Immutable, append-only.", pairs: ["CQRS", "Saga", "Publish-Subscribe"], tags: ["audit trail", "immutable", "replay", "compliance"] },

  { name: "Sidecar", category: "Infrastructure", complexity: 2, problem: "Cross-cutting concerns polluting business logic", when: "Service mesh, observability, security in Kubernetes", avoid: "Not using containers, or concern is library-simple", example: "Envoy sidecar handles mTLS, retries, tracing — service just does forecasting", howItWorks: "Helper container alongside main container in same pod. Intercepts traffic or provides aux services.", pairs: ["Ambassador", "Service Mesh", "Circuit Breaker"], tags: ["container", "Kubernetes", "observability"] },
  { name: "Ambassador", category: "Infrastructure", complexity: 2, problem: "Service needs smart outbound connectivity", when: "DB connection pooling, external API proxying, legacy bridging", avoid: "Direct connection is reliable and simple", example: "Ambassador handles connection pooling to Cosmos DB from forecast workers", howItWorks: "Specialized sidecar as outbound proxy. Service talks to localhost, ambassador connects to remote.", pairs: ["Sidecar", "Circuit Breaker", "Proxy"], tags: ["outbound proxy", "connection pooling"] },
  { name: "Circuit Breaker", category: "Infrastructure", complexity: 2, problem: "Downstream failures cascade and take everything down", when: "Any cross-service call, external API dependencies", avoid: "Downstream is in-process or failure is acceptable", example: "Circuit breaker on Azure Doc Intelligence — fallback to cached extraction", howItWorks: "Track failures. Exceed threshold → OPEN (fallback). Cooldown → HALF-OPEN (test). Success → CLOSED.", pairs: ["Bulkhead", "Retry", "Timeout"], tags: ["resilience", "cascading failure", "fallback"] },
  { name: "Bulkhead", category: "Infrastructure", complexity: 2, problem: "One slow dependency exhausts shared resources and kills everything", when: "Multiple downstreams sharing thread/connection pools", avoid: "Single downstream, or resources aren't shared", example: "Separate thread pools: BizView can't starve batch processing", howItWorks: "Isolate resources per dependency. If one floods, others keep working. Separate thread/connection pools.", pairs: ["Circuit Breaker", "Sidecar", "Rate Limiter"], tags: ["isolation", "resource partitioning", "fault containment"] },
  { name: "Retry", category: "Infrastructure", complexity: 1, problem: "Transient failures cause unnecessary errors", when: "HTTP calls, DB connections — any transient failure", avoid: "Non-idempotent operations, permanent failures", example: "Retry OCR 3 times with exponential backoff + jitter", howItWorks: "On failure, wait and retry. Exponential backoff + jitter. Max retries + timeout. Only transient errors.", pairs: ["Circuit Breaker", "Bulkhead", "Timeout"], tags: ["transient failure", "backoff", "resilience"] },
  { name: "Timeout", category: "Infrastructure", complexity: 1, problem: "Slow dependencies hang indefinitely consuming resources", when: "Every external call. No exceptions.", avoid: "Never — always set timeouts", example: "5s timeout on model API — fail fast not hang 60s", howItWorks: "Max duration for operation. Cancel and return error/fallback if exceeded.", pairs: ["Circuit Breaker", "Retry", "Bulkhead"], tags: ["deadline", "fail fast", "always use"] },
  { name: "Saga", category: "Infrastructure", complexity: 3, problem: "Need transaction-like guarantees across microservices", when: "Order flows spanning services, multi-step workflows", avoid: "Can keep in one DB — use regular ACID transactions", example: "Reserve compute → Run model → Store → Notify — compensate on failure", howItWorks: "Local transactions with compensating actions. Choreography (events) or Orchestration (coordinator).", pairs: ["CQRS", "Event Sourcing", "Outbox"], tags: ["distributed transaction", "compensation", "eventual consistency"] },
  { name: "Outbox", category: "Infrastructure", complexity: 3, problem: "Dual-write: need DB update AND event publish atomically", when: "Event-driven systems needing DB-broker consistency", avoid: "At-most-once delivery acceptable or no events", example: "Write forecast result + event to DB in one tx → relay publishes to Kafka", howItWorks: "Write data and event to DB in one transaction. Separate process publishes from outbox to broker.", pairs: ["Saga", "Event Sourcing", "Publish-Subscribe"], tags: ["atomicity", "dual write", "CDC", "Kafka"] },
  { name: "Strangler Fig", category: "Infrastructure", complexity: 2, problem: "Legacy needs replacing but big-bang rewrite is too risky", when: "Monolith→microservices, platform modernization", avoid: "System small enough for clean rewrite", example: "Route new forecast types to new service, legacy types still hit old system", howItWorks: "Facade in front of legacy. New features → new system. Gradually migrate. Decommission old when empty.", pairs: ["API Gateway", "Facade", "Anti-Corruption Layer"], tags: ["migration", "legacy", "gradual", "low risk"] },
  { name: "Anti-Corruption Layer", category: "Infrastructure", complexity: 2, problem: "Legacy/external system's bad model would pollute your domain", when: "Legacy integration, bad third-party APIs, bounded context boundaries", avoid: "External model is clean and compatible", example: "ACL translates BizView's legacy format into Zenith's clean domain model", howItWorks: "Translation layer between systems. Translates models, validates data. DDD bounded context strategy.", pairs: ["Adapter", "Facade", "Strangler Fig"], tags: ["DDD", "bounded context", "legacy", "isolation"] },
  { name: "API Gateway", category: "Infrastructure", complexity: 2, problem: "Clients need single entry point to multiple services", when: "Multiple microservices needing unified auth, routing, rate limiting", avoid: "Single backend — direct access simpler", example: "Gateway routes /forecast→Zenith, /accounts→BizView, handles auth", howItWorks: "Reverse proxy handling routing, auth, TLS, rate limiting, response aggregation.", pairs: ["BFF", "Circuit Breaker", "Rate Limiter"], tags: ["routing", "edge", "auth", "Kong", "NGINX"] },
  { name: "BFF", category: "Infrastructure", complexity: 2, problem: "Different clients need different API shapes", when: "Mobile needs compact, web needs rich, third-party needs different schema", avoid: "One client type or trivial differences", example: "Mobile BFF: compact summary. Web BFF: full charts + metadata", howItWorks: "Backend for Frontend — separate backend per client type. Each aggregates and transforms optimally.", pairs: ["API Gateway", "Facade", "Adapter"], tags: ["client-specific", "mobile", "web", "aggregation"] },
  { name: "Service Mesh", category: "Infrastructure", complexity: 3, problem: "Service-to-service comms need consistent security, observability, traffic control", when: "Large deployments (50+ services), mTLS/tracing/canary everywhere", avoid: "Few services — API gateway suffices", example: "Istio handles retries, mTLS, tracing, canary across all services", howItWorks: "Sidecar proxies (data plane) managed by control plane. Handles mTLS, retries, load balancing transparently.", pairs: ["Sidecar", "Circuit Breaker", "API Gateway"], tags: ["Istio", "Linkerd", "mTLS", "observability"] },
  { name: "Rate Limiter", category: "Infrastructure", complexity: 2, problem: "System overwhelmed by too many requests", when: "Public APIs, multi-tenant, abuse prevention", avoid: "Internal service with trusted callers", example: "100 forecast requests/min per tenant — prevent one from degrading others", howItWorks: "Track counts per client. Token bucket, sliding window, or leaky bucket. 429 + Retry-After.", pairs: ["API Gateway", "Bulkhead", "Circuit Breaker"], tags: ["throttling", "fairness", "multi-tenant"] },
  { name: "Leader Election", category: "Infrastructure", complexity: 3, problem: "Distributed instances need coordination — only one should act", when: "Scheduled jobs, DB migrations, singleton processes in cluster", avoid: "Single instance or all can safely run", example: "One instance runs nightly retraining — others standby", howItWorks: "Instances compete for lock (ZooKeeper, Redis, DB). Winner is leader. Others monitor. Re-elect on failure.", pairs: ["Singleton", "Circuit Breaker"], tags: ["distributed lock", "coordination", "consensus"] },
  { name: "Sharding", category: "Infrastructure", complexity: 3, problem: "Single DB can't handle data volume or throughput", when: "Massive datasets, write-heavy, multi-tenant isolation", avoid: "Data fits in one DB with acceptable performance", example: "Shard forecast data by region — US on one cluster, EU on another", howItWorks: "Partition across multiple DB instances by shard key. Routing layer directs queries.", pairs: ["CQRS", "API Gateway"], tags: ["horizontal scaling", "partitioning", "database"] },
  { name: "Health Check", category: "Infrastructure", complexity: 1, problem: "Need to know if a service is alive and ready for traffic", when: "Any production service — Kubernetes liveness/readiness", avoid: "Never — always implement health checks", example: "/health/live → process alive. /health/ready → deps connected", howItWorks: "HTTP endpoints reporting health. Liveness (restart if not). Readiness (remove from LB if not).", pairs: ["Circuit Breaker", "Service Mesh"], tags: ["Kubernetes", "liveness", "readiness", "always use"] },
